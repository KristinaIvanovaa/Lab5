spring:
  application:
    name: theatre
  web:
    locale: ru_RU
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/theatre_lab3}
    username: ${DB_USERNAME:theatre_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
security:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-change-before-deployment-32-bytes-minimum}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
